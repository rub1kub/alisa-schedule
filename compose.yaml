name: alisa-schedule
services:
  skill:
    image: alisa-schedule:local
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:18791:8000"
    volumes:
      - ./data:/app/data:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.50
    pids_limit: 64
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
