<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кэпик — расписание колледжа</title>
  <meta name="description" content="Кэпик — мой навык Алисы с расписанием Краснодарского колледжа электронного приборостроения. Выберите группу и спросите, что завтра.">
  <meta name="theme-color" content="#111111">
  <link rel="canonical" href="https://kkepik.rub1kub.ru/">
  <style>
    :root { color-scheme: dark; --background: #111; --text: #f5f5f5; --muted: #999; --red: #ef5555; --blue: #588df4; --green: #50b77b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    main { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; padding: 28px 24px; }
    .content { flex: 1; width: min(100%, 680px); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 56px 0; }
    h1 { margin: 0; font-size: clamp(72px, 12vw, 104px); line-height: 1.1; letter-spacing: -.065em; font-weight: 600; }
    .colors { display: flex; gap: 5px; margin: 21px 0; }
    .colors i { width: 20px; height: 2px; background: var(--red); }
    .colors i:nth-child(2) { background: var(--blue); }
    .colors i:nth-child(3) { background: var(--green); }
    .tagline { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.6; }
    .command { margin: 32px 0 18px; max-width: 580px; font-size: clamp(20px, 3vw, 25px); line-height: 1.5; letter-spacing: -.02em; }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 4px; }
    a:focus-visible { outline: 2px solid var(--blue); outline-offset: 6px; }
    .guide { color: var(--blue); font-size: 14px; padding: 8px 0; }
    footer { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 23px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    footer a { padding: 5px 0; }
    @media (max-width: 420px) {
      main { padding: 22px 20px; }
      .content { padding: 44px 0; }
      .tagline { font-size: 15px; }
      .command { max-width: 300px; }
      footer { gap: 8px 18px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="content">
      <h1>Кэпик</h1>
      <div class="colors" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="tagline">Расписание колледжа в Алисе.</p>
      <p class="command">«Алиса, спроси у Кэпика, что завтра»</p>
      <a class="guide" href="/guide">Как пользоваться →</a>
    </div>
    <footer aria-label="Ссылки проекта">
      <a href="https://t.me/kkepik_bot">Telegram</a>
      <a href="https://kkepik.rub1kub.ru/api/docs/#/">API</a>
      <a href="https://github.com/rub1kub/alisa-schedule" aria-label="Исходники навыка Алисы">Исходники</a>
      <a href="https://t.me/kkepuk">Поддержка</a>
      <a href="https://rub1kub.ru/">rub1kub</a>
    </footer>
  </main>
</body>
</html>
