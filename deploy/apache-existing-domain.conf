# Independent additive route. Existing virtual hosts and KKEPIK files are untouched.
# Apache <Location> proxying takes precedence over the site's catch-all WSGI alias.
<Location "/alice/webhook">
    ProxyPass "http://127.0.0.1:18791/webhook" connectiontimeout=1 timeout=4
    ProxyPassReverse "http://127.0.0.1:18791/webhook"
    LimitRequestBody 65536
    <RequireAll>
        Require expr "%{HTTP_HOST} =~ m#^kkepik\.rub1kub\.ru(?::443)?$#"
        Require expr "%{HTTPS} == 'on'"
        Require expr "%{REQUEST_URI} == '/alice/webhook'"
        Require method POST
    </RequireAll>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Cache-Control "no-store"
</Location>
