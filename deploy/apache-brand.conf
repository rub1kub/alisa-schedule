# Public project page, independent of the existing Telegram application.
<Location "/about">
    ProxyPass "http://127.0.0.1:18791/about" connectiontimeout=1 timeout=4
    ProxyPassReverse "http://127.0.0.1:18791/about"
    <RequireAll>
        Require expr "%{HTTP_HOST} =~ m#^kkepik\.rub1kub\.ru(?::443)?$#"
        Require expr "%{REQUEST_URI} =~ m#^/about/?$#"
        Require method GET HEAD
    </RequireAll>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
</Location>

# Public Webmaster ownership proof; this is not an authentication credential.
<Location "/yandex_f031293cd6d4c038.html">
    ProxyPass "http://127.0.0.1:18791/yandex_f031293cd6d4c038.html" connectiontimeout=1 timeout=4
    ProxyPassReverse "http://127.0.0.1:18791/yandex_f031293cd6d4c038.html"
    <RequireAll>
        Require expr "%{HTTP_HOST} =~ m#^kkepik\.rub1kub\.ru(?::443)?$#"
        Require expr "%{HTTPS} == 'on'"
        Require expr "%{REQUEST_URI} == '/yandex_f031293cd6d4c038.html'"
        Require method GET HEAD
    </RequireAll>
    Header always set X-Content-Type-Options "nosniff"
</Location>
